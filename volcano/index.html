<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volcano Physics Simulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #eee;
      display: flex;
      gap: 20px;
      padding: 20px;
      min-height: 100vh;
      overflow: hidden;
    }

    #simulation-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: calc(100vw - 650px);
      position: relative;
    }

    #simulation-canvas-pixel,
    #simulation-canvas-webgl {
      border: 2px solid #444;
      cursor: crosshair;
      background: #000;
      width: 640px;
      height: 640px;
      aspect-ratio: 1 / 1;
      position: absolute;
      top: 0;
      left: 0;
    }

    #simulation-canvas-pixel {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #fps-display {
      font-size: 14px;
      color: #0f0;
      text-shadow: 0 0 4px #0f0;
      margin-top: 650px;
    }

    #info-panel {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      min-width: 250px;
      max-width: 250px;
      border: 1px solid #444;
      align-self: flex-start;
    }

    #control-panel {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      min-width: 280px;
      max-width: 280px;
      border: 1px solid #444;
    }

    h2 {
      margin-bottom: 20px;
      color: #ff6b35;
      text-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
    }

    h3 {
      margin: 20px 0 10px 0;
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
    }

    .slider-group {
      margin: 15px 0;
    }

    .slider-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .slider-group span {
      color: #ff6b35;
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #444;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff6b35;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 107, 53, 0.6);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff6b35;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(255, 107, 53, 0.6);
    }

    .renderer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .renderer-buttons button {
      padding: 10px;
      border: 2px solid #444;
      border-radius: 4px;
      background: #333;
      color: #eee;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .renderer-buttons button:hover {
      background: #444;
      border-color: #666;
    }

    .renderer-buttons button.active {
      border-color: #4a9eff;
      background: #1a3a5a;
      box-shadow: 0 0 10px rgba(74, 158, 255, 0.4);
    }

    .material-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .material-buttons button {
      padding: 10px;
      border: 2px solid #444;
      border-radius: 4px;
      background: #333;
      color: #eee;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .material-buttons button:hover {
      background: #444;
      border-color: #666;
    }

    .material-buttons button.active {
      border-color: #ff6b35;
      background: #442211;
      box-shadow: 0 0 10px rgba(255, 107, 53, 0.4);
    }

    .material-buttons button[data-material="lava"] { color: #ff4500; }
    .material-buttons button[data-material="rock"] { color: #808080; }
    .material-buttons button[data-material="gas"] { color: #999; }
    .material-buttons button[data-material="water"] { color: #1e90ff; }
    .material-buttons button[data-material="ice"] { color: #b0e5f5; }
    .material-buttons button[data-material="vapor"] { color: #b0e0e6; }
    .material-buttons button[data-material="air"] { color: #e6f2ff; }
    .material-buttons button[data-material="grass"] { color: #228b22; }
    .material-buttons button[data-material="empty"] { color: #666; }

    .info {
      margin-top: 20px;
      padding: 12px;
      background: #222;
      border-radius: 4px;
      font-size: 11px;
      color: #999;
      border-left: 3px solid #ff6b35;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 12px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #999;
      font-weight: normal;
    }

    .info-value {
      color: #ff6b35;
      font-weight: bold;
    }

    .no-cell-info {
      color: #666;
      font-style: italic;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="simulation-container">
    <canvas id="simulation-canvas-pixel" width="128" height="128"></canvas>
    <canvas id="simulation-canvas-webgl" width="128" height="128" style="display: none;"></canvas>
    <div id="fps-display">FPS: 0</div>
  </div>

  <div id="info-panel">
    <h2>📊 Cell Info</h2>
    <div id="cell-info">
      <div class="no-cell-info">Hover over cells to view information</div>
    </div>
  </div>

  <div id="control-panel">
    <h2>🌋 Volcano Simulator</h2>

    <div class="slider-group">
      <label>Injection Rate: <span id="rate-value">0.5</span></label>
      <input type="range" id="injection-rate" min="0" max="10" step="0.5" value="0.5">
    </div>

    <div class="slider-group">
      <label>Lava Temperature: <span id="temp-value">1500</span>°C</label>
      <input type="range" id="lava-temp" min="800" max="2000" step="50" value="1500">
    </div>

    <div class="slider-group">
      <label>Physics Speed: <span id="physics-rate-value">20</span> FPS</label>
      <input type="range" id="physics-rate" min="5" max="60" step="5" value="20">
    </div>

    <h3>Renderer</h3>
    <div class="renderer-buttons">
      <button id="renderer-pixel" class="active">Pixel</button>
      <button id="renderer-webgl">Smooth (WebGL)</button>
    </div>

    <h3>Material Brush</h3>
    <div class="material-buttons">
      <button data-material="lava">🔥 Lava</button>
      <button data-material="rock" class="active">🪨 Rock</button>
      <button data-material="gas">💨 Gas</button>
      <button data-material="water">💧 Water</button>
      <button data-material="ice">🧊 Ice</button>
      <button data-material="vapor">☁️ Vapor</button>
      <button data-material="air">💨 Air</button>
      <button data-material="grass">🌱 Grass</button>
      <button data-material="empty">⬛ Empty</button>
    </div>

    <div class="slider-group">
      <label>Brush Size: <span id="brush-value">2</span></label>
      <input type="range" id="brush-size" min="1" max="10" step="1" value="2">
    </div>

    <div class="info">
      <strong>Controls:</strong><br>
      • Click bottom to inject lava<br>
      • Paint with selected material<br>
      • Watch temperature colors!
    </div>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
